[package]
edition = "2024"
rust-version = "1.91"
name = "boko"
version = "0.6.0"
build = false
exclude = [
    "/tests/fixtures",
    "/fuzz",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fast native ebook converter for EPUB, KFX, AZW3, and MOBI — the only KFX writer that needs no Kindle Previewer"
homepage = "https://github.com/zacharydenton/boko"
documentation = "https://docs.rs/boko"
readme = "README.md"
keywords = [
    "ebook",
    "epub",
    "kfx",
    "azw3",
    "kindle",
]
categories = [
    "parsing",
    "encoding",
]
license = "GPL-3.0-or-later"
repository = "https://github.com/zacharydenton/boko"

[features]
cli = [
    "dep:clap",
    "dep:serde",
    "dep:serde_json",
    "dep:ion-rs",
    "optimize-images",
]
default = [
    "cli",
    "parallel",
]
optimize-images = ["dep:image"]
parallel = ["dep:rayon"]
wasm = [
    "wasm-bindgen",
    "console_error_panic_hook",
]

[lib]
